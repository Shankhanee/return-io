name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Ensure google-services.json is in app module
        run: |
          if [ -f android/google-services.json ] && [ ! -f android/app/google-services.json ]; then
            cp android/google-services.json android/app/google-services.json
          fi

      - name: Build Release APK
        run: flutter build apk --release --no-pub

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: return_io_android_apk
          path: build/app/outputs/flutter-apk/app-release.apk
